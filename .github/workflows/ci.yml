name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deps:
    # Não há código-fonte para lint/teste/build (ver docs/auditoria). O CI garante que as
    # dependências do lockfile instalam e que não há vulnerabilidade alta/crítica em produção.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Auditoria de dependências (produção)
        run: npm audit --omit=dev --audit-level=high
